<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Logo Bengkel Arek Gubeng: kunci pas + roda gigi (digambar sendiri) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#fb8a3c"/>
    </linearGradient>
    <mask id="kunci">
      <rect width="64" height="64" fill="#fff"/>
      <g transform="rotate(-45 32 32)" fill="#000">
        <!-- mulut kunci pas -->
        <rect x="28" y="2" width="8" height="13" rx="1"/>
      </g>
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <g fill="#16181b">
    <!-- roda gigi kecil di belakang -->
    <g transform="translate(43 43)">
      <circle r="8.5"/>
      <g id="gigi">
        <rect x="-2.6" y="-12" width="5.2" height="6" rx="1"/>
      </g>
      <use href="#gigi" transform="rotate(45)"/>
      <use href="#gigi" transform="rotate(90)"/>
      <use href="#gigi" transform="rotate(135)"/>
      <use href="#gigi" transform="rotate(180)"/>
      <use href="#gigi" transform="rotate(225)"/>
      <use href="#gigi" transform="rotate(270)"/>
      <use href="#gigi" transform="rotate(315)"/>
      <circle r="3.6" fill="url(#bg)"/>
    </g>
    <!-- kunci pas diagonal -->
    <g mask="url(#kunci)">
      <g transform="rotate(-45 32 32)">
        <circle cx="32" cy="14" r="10.5"/>
        <rect x="28" y="18" width="8" height="34" rx="4"/>
      </g>
    </g>
  </g>
</svg>
